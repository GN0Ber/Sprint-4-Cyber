name: Security CI - API

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  sast_sca_dast:
    runs-on: ubuntu-24.04

    # MySQL de apoio para a API durante o pipeline
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wisebuddy
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    # Variáveis (use GitHub Secrets para segredos)
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/wisebuddy
      DB_USER: root
      DB_PASS: root
      PII_AES_KEY: ${{ secrets.PII_AES_KEY }}   # defina em Settings > Secrets and variables > Actions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure jq & mysql-client
        run: sudo apt-get update && sudo apt-get install -y jq mysql-client

      # ---------- SAST (Semgrep) ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install semgrep==1.93.0

      - name: Semgrep (Java)
        run: |
          semgrep --config p/owasp-top-ten --config p/java \
                  --exclude target \
                  --json --output semgrep-java.json

      - name: Semgrep (JS/TS)
        run: |
          semgrep --config p/owasp-top-ten --config p/javascript \
                  --exclude target \
                  --json --output semgrep-js.json || true

      # ---------- Secret scanning ----------
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --no-banner --redact --report-format json --report-path gitleaks.json
        continue-on-error: true

      # ---------- Build ----------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Maven package (skip tests)
        run: mvn -B -DskipTests package

      # ---------- SCA (OWASP Dependency-Check) ----------
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "WiseBuddyAPI"
          path: "."
          format: "HTML,JSON"
          args: >
            --failOnCVSS 7
            --disableYarnAudit
            --disableNodeAudit
        continue-on-error: true

      - name: Move DepCheck reports
        run: |
          mkdir -p security-reports/api
          mv dependency-check-report.html security-reports/api/depcheck.html || true
          mv dependency-check-report.json security-reports/api/depcheck.json || true

      # ---------- Seed DB ----------
      - name: Seed DB
        run: |
          cat > seed.sql <<'SQL'
          CREATE TABLE IF NOT EXISTS users (
            id BIGINT PRIMARY KEY AUTO_INCREMENT,
            name VARCHAR(100),
            email VARCHAR(120) UNIQUE,
            password VARCHAR(255),
            role VARCHAR(20)
          );
          INSERT IGNORE INTO users (name,email,password,role) VALUES
            ('Admin','admin@wisebuddy.dev', SHA2('Admin@123',256), 'ADMIN'),
            ('User','user@wisebuddy.dev',  SHA2('User@123',256),  'USER');
          SQL
          mysql -h 127.0.0.1 -uroot -proot wisebuddy < seed.sql

      # ---------- Run API ----------
      - name: Run API
        run: |
          nohup java -jar target/*-SNAPSHOT.jar \
            --server.port=8085 \
            --spring.profiles.active=prod \
            --spring.datasource.url="${DB_URL}" \
            --spring.datasource.username="${DB_USER}" \
            --spring.datasource.password="${DB_PASS}" > api.log 2>&1 & \
          echo $! > api.pid

      - name: Wait API readiness
        run: |
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8085/actuator/health/readiness | grep -q '"status":"UP"'; then
              echo "API READY"; exit 0
            fi
            sleep 2
          done
          echo "API didn't become READY in time"
          echo "---- api.log (tail) ----"
          tail -n 200 api.log || true
          exit 1

      # ---------- DAST (OWASP ZAP) ----------
      - name: ZAP Baseline (throttled)
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: "http://127.0.0.1:8085"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: >
            -m 5
            -I
            -a
            --auto
            -z "spider.maxDuration=2"
          artifact_name: "zap-scan"
        continue-on-error: true

      - name: Collect ZAP + API log
        run: |
          mkdir -p security-reports/api
          [ -f report_html.html ] && mv report_html.html security-reports/api/zap.html || true
          [ -f report_json.json ] && mv report_json.json security-reports/api/zap.json || true
          [ -f api.log ] && mv api.log security-reports/api/api.log || true

      # ---------- Rich HTML & PDF report ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build rich HTML report
        run: |
          mkdir -p security-reports
          node <<'NODE'
          const fs = require('fs');
          const safeRead = (p, fb) => { try { return JSON.parse(fs.readFileSync(p,'utf8')); } catch { return fb; } };
          const exists = p => { try { fs.accessSync(p); return true; } catch { return false; } };
          const esc = s => String(s??'').replace(/[&<>]/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m]));
          const semgrepJava = safeRead('semgrep-java.json', {results:[]});
          const semgrepJs   = safeRead('semgrep-js.json',   {results:[]});
          const zap         = safeRead('security-reports/api/zap.json', {site:[]});
          const depcheck    = safeRead('security-reports/api/depcheck.json', {dependencies:[]});
          const apiLog      = exists('security-reports/api/api.log') ? fs.readFileSync('security-reports/api/api.log','utf8') : '';
          const sgAll = [...semgrepJava.results, ...semgrepJs.results];
          const sevOrder = {ERROR:3, WARNING:2, INFO:1, LOW:1, MEDIUM:2, HIGH:3};
          const sgCounts = sgAll.reduce((a,r)=>{ const s=r.extra?.severity||'INFO'; a[s]=(a[s]||0)+1; return a; },{});
          const zapAlerts = []; (zap.site||[]).forEach(site=> (site.alerts||[]).forEach(a=> zapAlerts.push(a)));
          const riskOrder = { 'High':3, 'Medium':2, 'Low':1, 'Informational':0, 'Info':0 };
          const zapCounts = zapAlerts.reduce((a,z)=>{ const r=z.risk||'Info'; a[r]=(a[r]||0)+1; return a; },{});
          const deps = (depcheck.dependencies||[]).flatMap(d=>{
            const vulns = d.vulnerabilities||[]; 
            return vulns.map(v=>({name:d.fileName||d.name||'unknown', id:v.name||v.cve||'', score:v.cvssScore||v.cvssv3?.baseScore||0, severity:v.severity||'', desc:v.description||''}));
          });
          const scaCounts = deps.reduce((a,v)=>{ a[v.severity]=(a[v.severity]||0)+1; return a; },{});
          const css = `body{font-family:Arial,Helvetica,sans-serif;margin:24px}h1{margin-bottom:4px}h2{margin-top:28px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid #ddd;border-radius:10px;padding:12px}table{width:100%;border-collapse:collapse;margin-top:8px}th,td{border:1px solid #e5e5e5;padding:6px;text-align:left;font-size:14px;vertical-align:top}th{background:#f7f7f7}code,pre{background:#111;color:#eee;padding:8px;border-radius:6px;overflow:auto}.small{font-size:12px;color:#666}`;
          const renderCounts = obj => {
            const entries = Object.entries(obj||{}).sort((a,b)=> (b[1]-a[1]));
            if (!entries.length) return '<p class="small">Sem achados.</p>';
            return `<table><tr><th>Categoria</th><th>Qtde</th></tr>${
              entries.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')
            }</table>`;
          };
          let html = `<!doctype html><html><head><meta charset="utf-8"><title>Relatório de Segurança - API</title><style>${css}</style></head><body>
          <h1>Relatório de Segurança — WiseBuddy API</h1>
          <p class="small">Gerado em ${new Date().toISOString()}</p>
          <h2>SAST</h2>${renderCounts(sgCounts)}
          <h2>DAST</h2>${renderCounts(zapCounts)}
          <h2>SCA</h2>${renderCounts(scaCounts)}
          <h2>Logs da API (tail)</h2><pre>${esc(apiLog.split('\n').slice(-120).join('\n'))}</pre>
          </body></html>`;
          fs.writeFileSync('security-reports/index.html', html);
          console.log('OK: security-reports/index.html gerado');
          NODE

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-api-html
          path: security-reports/index.html

      - name: Generate PDF (rich)
        run: |
          npm i puppeteer@23
          node -e "
            const puppeteer=require('puppeteer');
            (async()=>{
              const b=await puppeteer.launch({args:['--no-sandbox']});
              const p=await b.newPage();
              await p.goto('file://' + process.cwd() + '/security-reports/index.html',{waitUntil:'load'});
              await p.pdf({path:'security-reports/security-report-api.pdf', format:'A4', printBackground:true, margin:{top:'12mm',right:'10mm',bottom:'14mm',left:'10mm'}});
              await b.close();
            })();
          "

      - name: Upload PDF report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-api-pdf
          path: security-reports/security-report-api.pdf

      # ---------- Gates ----------
      - name: Fail on Semgrep (ERROR only) + print findings
        run: |
          echo "=== Semgrep findings (resumo) ==="
          jq -r '.results[] | "\(.extra.severity)\t\(.check_id)\t\(.path):\(.start.line)\t\(.extra.message)"' semgrep-java.json || true
          echo "=== END ==="
          # gate: só ERROR quebra o pipeline
          jq -e '[.results[] | select(.extra.severity=="ERROR")] | length == 0' semgrep-java.json \
          || (echo "Semgrep ERRORs found" && exit 1)


      - name: Fail on DepCheck CVSS >= 9
        run: |
          [ -f security-reports/api/depcheck.json ] || exit 0
          CRIT=$(jq '[.dependencies[]?.vulnerabilities[]? | select(.cvssScore>=9)] | length' security-reports/api/depcheck.json)
          [ "$CRIT" -gt 0 ] && { echo "Critical CVEs: $CRIT"; exit 1; } || true

      - name: Stop API
        if: always()
        run: kill $(cat api.pid) || true
