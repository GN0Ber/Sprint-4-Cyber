# ======================================================
# WiseBuddy - Profile: prod
# Configurado para produção e CI/CD com segurança
# ======================================================

spring.application.name=wiseBuddy
server.port=8085

# -------- Database Config --------
spring.datasource.url=jdbc:mysql://${DB_HOST:wisebuddy-mysql}:${DB_PORT:3306}/wisebuddy
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Opcional no Spring Boot 3 (o Hibernate detecta automaticamente)
spring.jpa.properties.hibernate.dialect= 

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jpa.packages-to-scan=com.wise.buddy.wiseBuddy.model

# -------- Segurança / Actuator --------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true
