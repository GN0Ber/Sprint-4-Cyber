# ======================================================
# WiseBuddy - Profile: prod
# Configurado para produção e CI/CD com segurança
# ======================================================

spring.application.name=wiseBuddy
server.port=8085

# -------- Database Config --------
# (Na pipeline, o --spring.datasource.url passado na linha de comando
#  vai sobrepor esta URL; localmente, usa os defaults abaixo)
spring.datasource.url=jdbc:mysql://${DB_HOST:wisebuddy-mysql}:${DB_PORT:3306}/wisebuddy
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------- JPA / Hibernate --------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# (Deixe o Hibernate escolher o dialect automaticamente)
# spring.jpa.properties.hibernate.dialect=

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jpa.packages-to-scan=com.wise.buddy.wiseBuddy.model

# -------- Actuator / Health --------
# expõe /actuator/health e /actuator/info
management.endpoints.web.exposure.include=health,info

# mostra detalhes do health (útil no CI)
management.endpoint.health.show-details=always

# habilita readiness/liveness (probes)
management.endpoint.health.probes.enabled=true
